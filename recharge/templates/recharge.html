<script>
    const STORAGE_KEY_NUMBER = "cc_saved_mobile_number";
    const STORAGE_KEY_OPERATOR = "cc_saved_operator";
    const STORAGE_KEY_CIRCLE = "cc_saved_circle";
    const STORAGE_KEY_PERMANENT_NUMBERS = "cc_permanent_numbers";

    let isOperatorLocked = false;
    let lastSeriesRequestId = 0;

    function handleOpLogoError(img) {
        img.style.display = 'none';
        const fallback = img.nextElementSibling;
        if (fallback) fallback.style.display = 'flex';
    }

    function setCircleDisplay(circleName) {
        const badge = document.getElementById('circleBadge');
        const textEl = document.getElementById('circleText');
        const hiddenEl = document.getElementById('circleInput');
        const cleanCircle = (circleName || '').trim();
        if (hiddenEl) hiddenEl.value = cleanCircle;
        if (cleanCircle) {
            if (textEl) textEl.textContent = cleanCircle;
            if (badge) badge.style.display = 'inline-block';
        } else {
            if (textEl) textEl.textContent = '-';
            if (badge) badge.style.display = 'none';
        }
    }

    function clearOperatorSelection() {
        isOperatorLocked = false;
        const selectBox = document.getElementById('operatorSelect');
        if (selectBox) {
            selectBox.value = "";
            selectBox.selectedIndex = 0;
            if (selectBox.options.length > 0) {
                selectBox.options[0].selected = true;
            }
            selectBox.dispatchEvent(new Event('change'));
        }
        document.querySelectorAll('.op-logo-chip').forEach(chip => {
            chip.classList.remove('selected-op');
        });
        toggleBsnlBox("");
        setCircleDisplay("");
    }

    function getPermanentNumbersList() {
        try {
            const raw = localStorage.getItem(STORAGE_KEY_PERMANENT_NUMBERS);
            const parsed = raw ? JSON.parse(raw) : [];
            return Array.isArray(parsed) ? parsed : [];
        } catch (e) {
            return [];
        }
    }

    function findSavedNumberRecord(number) {
        const cleanNum = (number || '').replace(/\D/g, '');
        if (!cleanNum) return null;
        const list = getPermanentNumbersList();
        return list.find(item => item && item.number === cleanNum) || null;
    }

    function savePermanentNumberRecord(number, operator, circle) {
        const cleanNum = (number || '').replace(/\D/g, '').slice(0, 10);
        if (!/^[6-9][0-9]{9}$/.test(cleanNum)) return;
        try {
            const existing = findSavedNumberRecord(cleanNum);
            const finalOp = (operator || (existing && existing.operator) || 'Jio').trim();
            const finalCircle = (circle || (existing && existing.circle) || '').trim();
            const list = getPermanentNumbersList().filter(item => item.number !== cleanNum);
            list.unshift({
                number: cleanNum,
                operator: finalOp,
                circle: finalCircle,
                savedAt: Date.now()
            });
            localStorage.setItem(STORAGE_KEY_PERMANENT_NUMBERS, JSON.stringify(list.slice(0, 50)));
        } catch (e) {
            console.warn("Permanent number save failed:", e);
        }
    }

    function saveNumberAndOperator(number, operator, circle) {
        try {
            const cleanNum = (number || '').replace(/\D/g, '').slice(0, 10);
            if (!cleanNum) {
                localStorage.removeItem(STORAGE_KEY_NUMBER);
                localStorage.removeItem(STORAGE_KEY_OPERATOR);
                localStorage.removeItem(STORAGE_KEY_CIRCLE);
                return;
            }
            localStorage.setItem(STORAGE_KEY_NUMBER, cleanNum);
            if (operator) {
                localStorage.setItem(STORAGE_KEY_OPERATOR, operator);
            }
            if (circle) {
                localStorage.setItem(STORAGE_KEY_CIRCLE, circle);
            }
            savePermanentNumberRecord(cleanNum, operator, circle);
        } catch (e) {
            console.warn("localStorage save failed:", e);
        }
    }

    function toggleBsnlBox(opValue) {
        const box = document.getElementById('bsnlTypeBox');
        if (!box) return;
        const lower = (opValue || '').toLowerCase();
        if (lower.includes('bsnl')) {
            box.style.display = 'flex';
            const btnC = document.getElementById('btnBsnlCombo');
            const btnT = document.getElementById('btnBsnlTopup');
            if (btnC) btnC.classList.toggle('active-bsnl', !lower.includes('topup'));
            if (btnT) btnT.classList.toggle('active-bsnl', lower.includes('topup'));
        } else {
            box.style.display = 'none';
        }
    }

    function chooseBsnlType(bsnlOp, btn) {
        document.querySelectorAll('.bsnl-type-btn').forEach(b => b.classList.remove('active-bsnl'));
        if (btn) btn.classList.add('active-bsnl');
        const selectBox = document.getElementById('operatorSelect');
        if (selectBox) selectBox.value = bsnlOp;
        isOperatorLocked = true;
        highlightOperatorChip('BSNL');
        const numVal = (document.getElementById('numberInput')?.value || '').trim();
        const circVal = (document.getElementById('circleInput')?.value || '').trim();
        if (numVal) {
            saveNumberAndOperator(numVal, bsnlOp, circVal);
        }
    }

    function highlightOperatorChip(opValue) {
        const lower = (opValue || '').toLowerCase();
        const target = lower.includes('bsnl') ? 'bsnl' : lower;
        document.querySelectorAll('.op-logo-chip').forEach(chip => {
            const chipOp = (chip.getAttribute('data-op') || '').toLowerCase();
            chip.classList.toggle('selected-op', Boolean(target && chipOp === target));
        });
        toggleBsnlBox(opValue);
    }

    function setOperatorValue(opName, lockSelection = true) {
        const selectBox = document.getElementById('operatorSelect');
        if (!selectBox || !opName) return;
        const targetOp = opName.toLowerCase() === 'bsnl' ? 'BSNL Combo' : opName;
        const matchedOpt = Array.from(selectBox.options).find(
            opt => opt.value.toLowerCase() === targetOp.toLowerCase() || opt.text.toLowerCase() === targetOp.toLowerCase()
        );
        selectBox.value = matchedOpt ? matchedOpt.value : targetOp;
        if (lockSelection && selectBox.value !== "") isOperatorLocked = true;
        highlightOperatorChip(selectBox.value);
    }

    function selectOperatorFromStrip(opName) {
        setOperatorValue(opName, true);
        const numVal = (document.getElementById('numberInput')?.value || '').trim();
        const circVal = (document.getElementById('circleInput')?.value || '').trim();
        const opVal = document.getElementById('operatorSelect')?.value || opName;
        if (numVal) {
            saveNumberAndOperator(numVal, opVal, circVal);
        }
    }

    const opSelectEl = document.getElementById('operatorSelect');
    if (opSelectEl) {
        opSelectEl.addEventListener('change', function () {
            isOperatorLocked = this.value !== "";
            highlightOperatorChip(this.value);
            const numVal = (document.getElementById('numberInput')?.value || '').trim();
            const circVal = (document.getElementById('circleInput')?.value || '').trim();
            if (numVal) {
                saveNumberAndOperator(numVal, this.value, circVal);
            }
        });
    }

    function selectService(serviceName, element) {
        if (serviceName.includes('Mobile')) {
            const svcEl = document.getElementById('serviceTypeInput');
            if (svcEl) svcEl.value = serviceName;
            document.querySelectorAll('.service-item').forEach(el => el.classList.remove('active'));
            if (element) element.classList.add('active');
        } else {
            window.location.href = `/recharge/billers?type=${encodeURIComponent(serviceName)}`;
        }
    }

    function toggleMoreServices(element) {
        const moreBox = document.getElementById('moreServicesContainer');
        if (!moreBox) return;
        if (moreBox.style.display === 'none' || !moreBox.style.display) {
            moreBox.style.display = 'grid';
            if (element) element.classList.add('active');
        } else {
            moreBox.style.display = 'none';
            if (element) element.classList.remove('active');
        }
    }

    function handleSearchKey(event) {
        if (event.key === 'Enter') {
            event.preventDefault();
            filterServices(event.target.value);
        }
    }

    function filterServices(query) {
        query = (query || '').toLowerCase().trim();
        if (!query) return;
        if (query.includes('dth') || query.includes('tv')) {
            window.location.href = `/recharge/billers?type=DTH`;
        } else if (query.includes('electricity') || query.includes('bijli') || query.includes('bill')) {
            window.location.href = `/recharge/billers?type=Electricity`;
        } else if (query.includes('gas')) {
            window.location.href = `/recharge/billers?type=Gas`;
        } else if (query.includes('fastag') || query.includes('tag')) {
            window.location.href = `/recharge/billers?type=FASTag`;
        }
    }

    function onNumberInput(val) {
        const inputEl = document.getElementById('numberInput');
        const cleaned = (val || '').replace(/\D/g, '').slice(0, 10);
        if (inputEl && inputEl.value !== cleaned) inputEl.value = cleaned;

        if (cleaned.length === 0) {
            clearOperatorSelection();
            return;
        }

        const savedRecord = findSavedNumberRecord(cleaned);
        if (savedRecord) {
            if (savedRecord.operator) {
                setOperatorValue(savedRecord.operator, true);
            }
            if (savedRecord.circle) {
                setCircleDisplay(savedRecord.circle);
            }
        } else if (cleaned.length < 4) {
            isOperatorLocked = false;
            setCircleDisplay('');
        }

        if (cleaned.length === 10) {
            const currentOp = (document.getElementById('operatorSelect')?.value || (savedRecord && savedRecord.operator) || 'Jio');
            const currentCircle = (document.getElementById('circleInput')?.value || (savedRecord && savedRecord.circle) || '').trim();
            savePermanentNumberRecord(cleaned, currentOp, currentCircle);
        }

        if (cleaned.length >= 2) {
            autoDetectOperator(cleaned, Boolean(savedRecord));
        }
    }

    async function autoDetectOperator(number, hasSavedRecord = false) {
        const firstTwo = number.substring(0, 2);
        const selectBox = document.getElementById('operatorSelect');
        let fallbackOp = "";

        if (['94', '93'].includes(firstTwo)) fallbackOp = "BSNL Combo";
        else if (['62', '70', '72', '75', '81', '82', '83', '84', '87', '88', '89'].includes(firstTwo)) fallbackOp = "Jio";
        else if (['98', '99', '97', '96', '95', '91', '90', '76', '77', '78', '79'].includes(firstTwo)) fallbackOp = "Airtel";
        else if (['86', '85', '73', '74'].includes(firstTwo)) fallbackOp = "Vi";

        if (fallbackOp && !isOperatorLocked && !hasSavedRecord && selectBox) {
            selectBox.value = fallbackOp;
            highlightOperatorChip(fallbackOp);
        }

        if (number.length < 4) return;

        const reqId = ++lastSeriesRequestId;
        try {
            const res = await fetch(`/recharge/detect-operator?number=${encodeURIComponent(number)}`);
            const data = await res.json();
            if (reqId !== lastSeriesRequestId) return;

            if (data && data.found) {
                const savedRec = findSavedNumberRecord(number);
                if (data.circle && !(savedRec && savedRec.circle)) {
                    setCircleDisplay(data.circle);
                }
                if (data.operator && !isOperatorLocked && !hasSavedRecord) {
                    setOperatorValue(data.operator, false);
                }
                if (number.length === 10) {
                    const finalOp = (savedRec && savedRec.operator) || (document.getElementById('operatorSelect')?.value) || data.operator || 'Jio';
                    const finalCircle = (savedRec && savedRec.circle) || data.circle || '';
                    savePermanentNumberRecord(number, finalOp, finalCircle);
                }
            }
        } catch (err) {
            console.error("Series detect error:", err);
        }
    }

    function handleFormSubmit(event) {
        event.preventDefault();
        const number = (document.getElementById('numberInput')?.value || '').trim();
        const operator = (document.getElementById('operatorSelect')?.value || '').trim();
        const circle = (document.getElementById('circleInput')?.value || '').trim();

        if (!/^[6-9][0-9]{9}$/.test(number)) {
            alert("कृपया 6–9 से शुरू होने वाला सही 10 अंकों का मोबाइल नंबर दर्ज करें।");
            document.getElementById('numberInput')?.focus();
            return;
        }
        if (!operator) {
            alert("कृपया ऑपरेटर चुनें।");
            document.getElementById('operatorSelect')?.focus();
            return;
        }

        saveNumberAndOperator(number, operator, circle);
        goToPlanPage(number, operator, circle);
    }

    function goToPlanPage(number, operator, circle = '') {
        const params = new URLSearchParams({
            number: number,
            operator: operator,
        });
        if (circle) params.set("circle", circle);
        window.location.href = `/recharge/plans?${params.toString()}`;
    }

    window.addEventListener('pageshow', function () {
        const submitBtn = document.querySelector('#rechargeForm button[type="submit"]');
        if (submitBtn) submitBtn.disabled = false;
    });
</script>
